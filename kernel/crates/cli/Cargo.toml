[package]
name = "tangis-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TanGIS 切片内核 CLI（M1 骨架）：plan / run，演示分块 Manifest + 拓扑排序 + 断点续切"

[[bin]]
name = "tangis-kernel"
path = "src/main.rs"

[dependencies]
tangis-manifest = { workspace = true }
tangis-osgb = { version = "0.1.0", path = "../osgb" }
tangis-geo = { workspace = true }
tangis-simplify = { workspace = true }
tangis-qc = { workspace = true }
tangis-editops = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
rayon = "1.12.0"
tobj = "4.0.5"
flate2 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
toml = { workspace = true }
