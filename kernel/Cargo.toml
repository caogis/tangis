[workspace]
resolver = "2"
members = [
    "crates/manifest",
    "crates/osgb",
    "crates/cli",
    "crates/geo",
    "crates/simplify",
    "crates/qc",
    "crates/editops",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
tangis-manifest = { path = "crates/manifest" }
tangis-osgb = { path = "crates/osgb" }
tangis-geo = { path = "crates/geo" }
tangis-simplify = { path = "crates/simplify" }
tangis-qc = { path = "crates/qc" }
tangis-editops = { path = "crates/editops" }
