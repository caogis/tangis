# TanGIS 本地开发环境
# 用法: docker compose up -d
# 端口约定: 宿主机端口 = 容器默认端口 + 10000，避开常用端口冲突

name: tangis

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: tangis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tangis}
      POSTGRES_USER: ${POSTGRES_USER:-tangis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tangis_dev_password}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tangis} -d ${POSTGRES_DB:-tangis}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    container_name: tangis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tangis-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tangis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tangis_dev_secret}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"    # S3 API
      - "${MINIO_CONSOLE_PORT:-19001}:9001" # Web 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: tangis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tangis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tangis_dev_secret}
    entrypoint: >
      /bin/sh -c '
      mc alias set tangis http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing tangis/tangis &&
      echo "MinIO bucket [tangis] ready"
      '

  nats:
    image: nats:2-alpine
    container_name: tangis-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"] # -js 启用 JetStream, -m 开启监控端点
    ports:
      - "${NATS_CLIENT_PORT:-14222}:4222"   # 客户端连接
      - "${NATS_MONITOR_PORT:-18222}:8222"  # 监控控制台 (http://localhost:18222)
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nats-data:
